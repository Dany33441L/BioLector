<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b3fd1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BioLector</title>
<style>
:root{--bg:#f1f5f4;--sf:#fff;--ink:#12302d;--mut:#5b716d;--ac:#4b3fd1;--acink:#fff;--ln:#d5e0dd;--tr:#eeebff}
@media(prefers-color-scheme:dark){:root{--bg:#101817;--sf:#17221f;--ink:#e3eeeb;--mut:#93aaa5;--ac:#9a91ff;--acink:#101817;--ln:#2a3a36;--tr:#222044}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font:700 22px "Iowan Old Style",Georgia,serif;margin:0;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
.ic{background:none;border:1px solid var(--ln);border-radius:10px;padding:6px 12px;cursor:pointer}
#f{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--sf)}
#q:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.go{background:var(--ac);color:var(--acink);border:0;border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer}
.fl{display:flex;gap:14px;margin-top:8px;font-size:14px;color:var(--mut)}
.fl label{display:flex;gap:6px;align-items:center}
main{padding:12px 14px 40px;max-width:720px;margin:0 auto}
.note{color:var(--mut);font-size:14px;margin:6px 0 12px}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ex button{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 14px;cursor:pointer}
.card{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font:600 18px/1.3 "Iowan Old Style",Georgia,serif;margin:2px 0 6px}
.meta{color:var(--mut);font-size:14px}
.src{display:inline-block;font-size:13px;color:var(--ac);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button,.acts a{border:1px solid var(--ln);background:none;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;text-decoration:none;color:inherit}
.acts .tr{background:var(--ac);color:var(--acink);border-color:var(--ac);font-weight:600}
.out{margin-top:10px;background:var(--tr);border-radius:10px;padding:10px 12px;font-size:15px}
.out h4{margin:0 0 6px;font:600 16px "Iowan Old Style",Georgia,serif}
.out p{margin:6px 0}
details{margin-top:10px;font-size:14px;color:var(--mut)}
summary{cursor:pointer}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--ink);width:min(92vw,520px);padding:16px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
dialog input,dialog textarea{width:100%;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg)}
dialog textarea{min-height:150px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>BioLector</h1><button class="ic" id="cfgBtn" type="button">Ajustes</button></div>
  <form id="f">
    <input id="q" type="search" placeholder="Busca un tema, en español o inglés" autocomplete="off" enterkeyhint="search">
    <button class="go" type="submit">Buscar</button>
  </form>
  <div class="fl">
    <label><input type="checkbox" id="fA" checked> Artículos</label>
    <label><input type="checkbox" id="fB" checked> Libros</label>
  </div>
</header>
<main>
  <div id="st" class="note">Busca en Europe PMC (incluye PubMed), OpenAlex, Open Library e Internet Archive. Solo contenido de acceso abierto.</div>
  <div class="ex" id="ex">
    <button type="button">producción de anticuerpos monoclonales</button>
    <button type="button">fed-batch biorreactor</button>
    <button type="button">CRISPR en levaduras</button>
  </div>
  <div id="res"></div>
</main>

<dialog id="dlg">
  <form method="dialog">
    <strong>Ajustes</strong>
    <label for="key">Clave de Gemini (se guarda solo en este teléfono)</label>
    <input id="key" type="password" autocomplete="off" placeholder="Pégala aquí">
    <label for="mdl">Modelo</label>
    <input id="mdl" type="text">
    <label for="gl">Glosario (un término por línea: inglés = español)</label>
    <textarea id="gl"></textarea>
    <p class="note">La clave la obtienes gratis en aistudio.google.com/apikey</p>
    <div class="acts"><button class="tr" id="save" value="ok">Guardar</button><button value="x">Cerrar</button></div>
  </form>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=h=>new DOMParser().parseFromString(h||'','text/html').body.textContent.trim();
const DEF_GL=`downstream processing = procesamiento aguas abajo
upstream processing = procesamiento aguas arriba
fed-batch = lote alimentado
titer = título (concentración de producto)
scale-up = escalamiento
bioreactor = biorreactor
yield = rendimiento
knockout = knockout (inactivación génica)`;
let cfg={key:'',model:'gemini-2.5-flash',gl:DEF_GL};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('bl_cfg')||'{}'))}catch(e){}
let R=[],lastQ='';

$('#cfgBtn').onclick=()=>{$('#key').value=cfg.key;$('#mdl').value=cfg.model;$('#gl').value=cfg.gl;$('#dlg').showModal()};
$('#save').onclick=()=>{cfg={key:$('#key').value.trim(),model:$('#mdl').value.trim()||'gemini-2.5-flash',gl:$('#gl').value};try{localStorage.setItem('bl_cfg',JSON.stringify(cfg))}catch(e){}};
$('#ex').onclick=e=>{if(e.target.tagName==='BUTTON'){$('#q').value=e.target.textContent;$('#f').requestSubmit()}};

async function gem(sys,text){
  if(!cfg.key)throw new Error('Falta la clave de Gemini. Agrégala en Ajustes.');
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{parts:[{text}]}],generationConfig:{temperature:.2}})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error?.message||('Error '+r.status));
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
}
const getJ=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};

const SRC={
 async epmc(q){
  const j=await getJ(`https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${encodeURIComponent(q+' AND OPEN_ACCESS:y')}&format=json&resultType=core&pageSize=10`);
  return (j.resultList?.result||[]).map(x=>({kind:'a',src:'Europe PMC',title:clean(x.title),authors:x.authorString||'',venue:x.journalTitle||'',year:x.pubYear||'',doi:x.doi||'',abs:clean(x.abstractText),url:x.doi?'https://doi.org/'+x.doi:`https://europepmc.org/article/${x.source}/${x.id}`}));
 },
 async oa(q){
  const j=await getJ(`https://api.openalex.org/works?search=${encodeURIComponent(q)}&filter=is_oa:true&per-page=10`);
  return (j.results||[]).map(x=>{let a=[];const ix=x.abstract_inverted_index||{};for(const k in ix)for(const p of ix[k])a[p]=k;
   return {kind:'a',src:'OpenAlex',title:x.display_name||'',authors:(x.authorships||[]).slice(0,6).map(t=>t.author.display_name).join(', '),venue:x.primary_location?.source?.display_name||'',year:x.publication_year||'',doi:(x.doi||'').replace('https://doi.org/',''),abs:a.join(' '),url:x.open_access?.oa_url||x.doi||x.id}});
 },
 async ol(q){
  const j=await getJ(`https://openlibrary.org/search.json?q=${encodeURIComponent(q+' AND has_fulltext:true')}&limit=8&fields=title,author_name,first_publish_year,key`);
  return (j.docs||[]).map(x=>({kind:'b',src:'Open Library',title:x.title,authors:(x.author_name||[]).slice(0,3).join(', '),venue:'',year:x.first_publish_year||'',doi:'',abs:'',url:'https://openlibrary.org'+x.key}));
 },
 async ia(q){
  const p=new URLSearchParams({q:`(${q}) AND mediatype:texts AND NOT access-restricted-item:true`,rows:8,output:'json'});
  ['identifier','title','creator','year','description'].forEach(f=>p.append('fl[]',f));
  const j=await getJ('https://archive.org/advancedsearch.php?'+p);
  return (j.response?.docs||[]).map(x=>({kind:'b',src:'Internet Archive',title:x.title||'',authors:[].concat(x.creator||[]).join(', '),venue:'',year:x.year||'',doi:'',abs:clean([].concat(x.description||[]).join(' ')),url:'https://archive.org/details/'+x.identifier}));
 }
};

$('#f').onsubmit=async e=>{
  e.preventDefault();
  const q0=$('#q').value.trim();if(!q0)return;
  $('#ex').hidden=true;$('#res').innerHTML='';
  let q=q0;
  if(cfg.key&&/[áéíóúñ¿¡]|\b(de|la|el|en|para|con|y|del)\b/i.test(q0)){
    $('#st').textContent='Traduciendo la búsqueda…';
    try{q=(await gem('Traduce al inglés científico esta consulta de búsqueda bibliográfica en biomedicina, biotecnología, bioquímica o medicina. Responde solo con la consulta traducida, sin comillas.',q0)).split('\n')[0]||q0}catch(err){q=q0}
  }
  lastQ=q0;
  const jobs=[];
  if($('#fA').checked)jobs.push(['Europe PMC',SRC.epmc],['OpenAlex',SRC.oa]);
  if($('#fB').checked)jobs.push(['Open Library',SRC.ol],['Internet Archive',SRC.ia]);
  if(!jobs.length){$('#st').textContent='Marca al menos Artículos o Libros.';return}
  $('#st').textContent='Buscando'+(q!==q0?` “${q}”`:'')+'…';
  const out=await Promise.allSettled(jobs.map(j=>j[1](q)));
  const seen=new Set(),fails=[];R=[];
  out.forEach((o,i)=>{
    if(o.status==='rejected'){fails.push(jobs[i][0]);return}
    o.value.forEach(r=>{const k=(r.doi||r.title).toLowerCase();if(!r.title||seen.has(k))return;seen.add(k);R.push(r)});
  });
  $('#st').textContent=`${R.length} resultados`+(q!==q0?` para “${q}”`:'')+(fails.length?`. No respondieron: ${fails.join(', ')}.`:'.');
  $('#res').innerHTML=R.length?R.map(card).join(''):'<p class="note">Sin resultados. Prueba con otras palabras.</p>';
};

function ref(r){return `${r.authors||'Autor desconocido'} (${r.year||'s. f.'}). ${r.title}.${r.venue?' '+r.venue+'.':''} ${r.url} [Fuente: ${r.src}]`}
function card(r,i){
  return `<article class="card" data-i="${i}">
  <span class="src">${esc(r.src)}</span>
  <h3>${esc(r.title)}</h3>
  <div class="meta">${esc(r.authors)}${r.authors&&(r.venue||r.year)?' · ':''}${esc([r.venue,r.year].filter(Boolean).join(', '))}</div>
  ${r.abs?`<details><summary>Original</summary><p>${esc(r.abs)}</p></details>`:''}
  <div class="out" hidden></div>
  <div class="acts"><button class="tr" data-a="t">Traducir al español</button><button data-a="c">Copiar referencia</button><a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir fuente</a></div>
  </article>`;
}

$('#res').onclick=async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const c=b.closest('.card'),r=R[c.dataset.i],o=c.querySelector('.out');
  if(b.dataset.a==='c'){
    try{await navigator.clipboard.writeText(ref(r));b.textContent='Copiada'}catch(err){b.textContent='No se pudo copiar'}
    setTimeout(()=>b.textContent='Copiar referencia',1800);return;
  }
  b.disabled=true;o.hidden=false;o.textContent='Traduciendo…';
  const sys=`Eres traductor científico de biomedicina, biotecnología, bioquímica y medicina. Traduce al español el texto recibido, adaptando la terminología a su área y manteniendo coherencia terminológica en todo el texto. Conserva todas las cifras, unidades, nombres de genes, especies, siglas y datos; no agregues, resumas ni omitas información. Si un término no tiene traducción establecida, escribe tu mejor traducción y el original en inglés entre paréntesis. Contexto: ${r.venue||r.src}, ${r.year||''}; el lector buscó "${lastQ}". Glosario obligatorio:\n${cfg.gl}\nResponde solo con la traducción: primera línea el título, luego una línea en blanco y el resto del texto.`;
  try{
    const t=await gem(sys,r.title+(r.abs?'\n\n'+r.abs:''));
    const [h,...rest]=t.split('\n');
    o.innerHTML=`<h4>${esc(h.replace(/^#+\s*|\*+/g,''))}</h4>`+rest.join('\n').split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p.replace(/\*\*/g,''))}</p>`).join('')+`<p class="meta">Traducción automática. Verifica con el original. Fuente: ${esc(r.src)}.</p>`;
  }catch(err){o.textContent=err.message}
  b.disabled=false;b.textContent='Traducir de nuevo';
};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
